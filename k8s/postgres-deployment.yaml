apiVersion: apps/v1
kind: Deployment
metadata:
  name: teedy-db
  namespace: teedy
  labels:
    app: teedy-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: teedy-db
  template:
    metadata:
      labels:
        app: teedy-db
    spec:
      containers:
      - name: postgres
        image: postgres:13
        ports:
        - containerPort: 5432
          name: postgres
          protocol: TCP
        env:
        - name: POSTGRES_DB
          value: "teedy"
        - name: POSTGRES_USER
          value: "teedy"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: teedy-db-secret
              key: password
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - teedy
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - teedy
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: postgres-data
        persistentVolumeClaim:
          claimName: postgres-data-pvc
