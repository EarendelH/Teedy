apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: teedy

resources:
  - namespace.yaml
  - secret.yaml
  - configmap.yaml
  - pvc.yaml
  - postgres-pvc.yaml
  - postgres-deployment.yaml
  - postgres-service.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml

labels:
  - pairs:
      app.kubernetes.io/name: teedy
      app.kubernetes.io/version: "1.12"
      app.kubernetes.io/managed-by: kustomize

commonLabels:
  project: teedy

images:
  - name: earendelheng/teedy
    newTag: latest
